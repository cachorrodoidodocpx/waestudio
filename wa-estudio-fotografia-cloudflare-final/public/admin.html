<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>WA — Painel administrativo</title>
<link rel="stylesheet" href="styles.css">
<style>
body.admin-page{background:#f5f3ef;color:#111;min-height:100vh}
.admin-shell{max-width:1200px;margin:0 auto;padding:42px 24px 70px}
.admin-head{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:34px}.admin-head h1{font-family:'Playfair Display',serif;font-weight:500;font-size:clamp(40px,6vw,74px);line-height:.95;margin:0}.admin-head p{margin:10px 0 0;color:#6d6a65}.admin-card{background:#fff;border:1px solid #ddd8d0;padding:24px}.admin-grid{display:grid;grid-template-columns:360px 1fr;gap:20px}.field{display:grid;gap:8px;margin-bottom:18px}.field label{font-size:12px;text-transform:uppercase;letter-spacing:.14em}.field input,.field select{padding:14px;border:1px solid #cec8bf;background:#fff;font:inherit}.admin-btn{border:1px solid #111;background:#111;color:#fff;padding:13px 18px;cursor:pointer}.admin-btn.light{background:#fff;color:#111}.admin-status{margin:14px 0;font-size:14px;min-height:22px}.drop{border:1px dashed #aaa;padding:22px;text-align:center;background:#faf9f7}.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}.thumb{background:#f1eee8;padding:8px}.thumb img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block}.thumb .name{font-size:11px;word-break:break-all;margin-top:7px}.thumb button{margin-top:7px;width:100%}.login{max-width:430px;margin:12vh auto}.hidden{display:none!important}@media(max-width:850px){.admin-grid{grid-template-columns:1fr}.admin-head{align-items:start;flex-direction:column}}
</style></head>
<body class="admin-page">
<div id="login" class="admin-shell login">
  <div class="admin-card">
    <p class="eyebrow dark">WA ESTÚDIO</p><h1>Painel.</h1><p>Área restrita para gerenciar o portfólio.</p>
    <form id="loginForm"><div class="field"><label>Senha</label><input id="password" type="password" autocomplete="current-password" required></div><button class="admin-btn" type="submit">Entrar</button></form>
    <div id="loginStatus" class="admin-status"></div>
  </div>
</div>
<div id="panel" class="admin-shell hidden">
  <div class="admin-head"><div><p class="eyebrow dark">WA ESTÚDIO</p><h1>Portfólio.</h1><p>Adicione e remova fotografias sem editar o código do site.</p></div><button id="logout" class="admin-btn light">Sair</button></div>
  <div class="admin-grid">
    <section class="admin-card">
      <h2>Adicionar fotos</h2>
      <form id="uploadForm">
        <div class="field"><label>Categoria</label><select id="category"><option value="casamento">Casamentos</option><option value="gestante">Gestante</option><option value="bebe-reborn">Baby Reborn</option><option value="infantil">Acompanhamento Infantil</option><option value="familia">Família</option><option value="ensaios">Ensaios</option><option value="natal">Natal</option><option value="datas-especiais">Datas Especiais</option></select></div>
        <div class="field"><label>Fotos</label><div class="drop"><input id="photos" type="file" accept="image/jpeg,image/png,image/webp" multiple required><p>JPG, PNG ou WEBP • até 15 MB por foto</p></div></div>
        <button class="admin-btn" type="submit">Enviar para o portfólio</button><div id="uploadStatus" class="admin-status"></div>
      </form>
      <p style="font-size:12px;color:#777">As fotos entram no R2 e aparecem no site público após o envio.</p>
    </section>
    <section class="admin-card"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><h2>Fotos no site</h2><button id="refresh" class="admin-btn light">Atualizar</button></div><div id="galleryAdmin" class="thumbs"></div><div id="adminStatus" class="admin-status"></div></section>
  </div>
</div>
<script>
const $ = s => document.querySelector(s);
const login = $('#login');
const panel = $('#panel');

async function readJson(response) {
  try { return await response.json(); } catch { return {}; }
}

async function check() {
  const r = await fetch('/api/admin', { cache: 'no-store' });
  const d = await readJson(r);
  if (d.authenticated) {
    login.classList.add('hidden');
    panel.classList.remove('hidden');
    await load();
  }
}

async function load() {
  const r = await fetch('/api/admin', { cache: 'no-store' });
  const d = await readJson(r);
  const box = $('#galleryAdmin');
  box.innerHTML = '';
  if (!r.ok || !d.authenticated) {
    box.innerHTML = '<p>Sua sessão expirou. Atualize a página e entre novamente.</p>';
    return;
  }
  if (d.error) {
    box.innerHTML = `<p>${d.error}</p>`;
    return;
  }
  if (!d.objects?.length) {
    box.innerHTML = '<p>Sem fotos enviadas pelo painel ainda.</p>';
    return;
  }

  for (const o of d.objects) {
    const el = document.createElement('div');
    el.className = 'thumb';
    const img = document.createElement('img');
    img.src = `/media/${o.key.split('/').map(encodeURIComponent).join('/')}`;
    img.loading = 'lazy';
    img.alt = o.key;
    const name = document.createElement('div');
    name.className = 'name';
    name.textContent = o.key;
    const button = document.createElement('button');
    button.className = 'admin-btn light';
    button.textContent = 'Excluir';
    button.onclick = async () => {
      if (!confirm('Excluir esta foto do site?')) return;
      const rr = await fetch('/api/admin', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'delete', key: o.key })
      });
      const x = await readJson(rr);
      if (x.ok) load();
      else $('#adminStatus').textContent = x.error || 'Erro ao excluir.';
    };
    el.append(img, name, button);
    box.appendChild(el);
  }
}

$('#loginForm').onsubmit = async e => {
  e.preventDefault();
  $('#loginStatus').textContent = 'Entrando...';
  const r = await fetch('/api/admin', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action: 'login', password: $('#password').value })
  });
  const d = await readJson(r);
  if (d.ok) {
    login.classList.add('hidden');
    panel.classList.remove('hidden');
    $('#password').value = '';
    await load();
  } else {
    $('#loginStatus').textContent = d.error || 'Não foi possível entrar.';
  }
};

$('#logout').onclick = async () => {
  await fetch('/api/admin', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action: 'logout' })
  });
  location.reload();
};

$('#refresh').onclick = load;

$('#uploadForm').onsubmit = async e => {
  e.preventDefault();
  const files = $('#photos').files;
  if (!files.length) return;
  const fd = new FormData();
  fd.append('category', $('#category').value);
  for (const f of files) fd.append('photos', f);
  $('#uploadStatus').textContent = `Enviando ${files.length} foto(s)...`;
  const r = await fetch('/api/admin', { method: 'POST', body: fd });
  const d = await readJson(r);
  if (d.ok) {
    const skipped = d.skipped?.length ? ` ${d.skipped.length} arquivo(s) ignorado(s).` : '';
    $('#uploadStatus').textContent = `${d.uploaded.length} foto(s) enviada(s).${skipped}`;
    $('#uploadForm').reset();
    await load();
  } else {
    $('#uploadStatus').textContent = d.error || 'Erro no envio.';
  }
};

check();
</script>
</body></html>
